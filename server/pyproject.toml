[project]
name = "fyde-server"
version = "0.1.0"
description = "Fyde Multimodal P2P File Sharing Relay & Orchestration Server"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.163.0",
    "httpx>=0.28.1",
    "numpy>=2.4.6",
    "pillow>=13.0.0",
    "pypdf>=7.1.0",
    "python-multipart>=0.0.33",
    "uvicorn[standard]>=0.54.0",
    "websockets>=17.4",
]

[dependency-groups]
dev = [
    "pytest>=9.2.0",
    "pytest-asyncio>=1.5.0",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
pythonpath = ["."]
asyncio_default_fixture_loop_scope = "function"
